name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-10-19 から Ubuntu 26 に移るため固定する
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: 依存のインストール
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: 動的解析の結合テスト用に、Pythonのコンテナイメージを取得する（無いとテストはスキップされる）
        run: docker pull python:3.12-slim
      - name: テスト（AIへの送信は行わない。HTTPはこの計算機内のスタブのみ）
        env:
          CODEINSIGHT_REQUIRE_CONTAINER: "1"  # コンテナの結合テストを、スキップではなく必須にする
        run: uv run --python ${{ matrix.python-version }} pytest -q tests

  lint:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-10-19 から Ubuntu 26 に移るため固定する
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
